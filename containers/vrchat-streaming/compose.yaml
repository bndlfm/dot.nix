services:
  neko:
    image: vrchat-neko-nvenc:3.1.5
    container_name: vrchat-neko
    restart: unless-stopped
    shm_size: 4gb
    cap_add:
      - SYS_ADMIN
    ports:
      - "8085:8080"
      - "52000-52100:52000-52100/udp"
    environment:
      TZ: America/Chicago
      NEKO_SERVER_PROXY: "true"
      NEKO_WEBRTC_EPR: "52000-52100"
      NEKO_WEBRTC_ICELITE: "true"
      NEKO_WEBRTC_NAT1TO1: ${NEKO_WEBRTC_NAT1TO1:-192.168.1.5}
      NEKO_DESKTOP_SCREEN: "1920x1080@30"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_USER_PASSWORD:?Set NEKO_USER_PASSWORD in /data/.secret/vrchat-streaming.env}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_ADMIN_PASSWORD:?Set NEKO_ADMIN_PASSWORD in /data/.secret/vrchat-streaming.env}
      NEKO_SESSION_CONTROL_PROTECTION: "true"
      NEKO_CAPTURE_VIDEO_CODEC: h264
      NEKO_CAPTURE_BROADCAST_URL: placeholder
      NEKO_CAPTURE_BROADCAST_AUTOSTART: "true"
      NEKO_CAPTURE_VIDEO_PIPELINE: >-
        ximagesrc display-name={display} show-pointer=true use-damage=false !
        video/x-raw,framerate=30/1 !
        cudaupload ! cudaconvert ! queue !
        video/x-raw(memory:CUDAMemory),format=NV12 !
        nvautogpuh264enc name=encoder preset=2 gop-size=30 bitrate=6144
        vbv-buffer-size=6144 !
        h264parse config-interval=-1 !
        video/x-h264,stream-format=byte-stream ! queue !
      NEKO_CAPTURE_BROADCAST_PIPELINE: >-
        ximagesrc display-name={display} show-pointer=true use-damage=false !
        queue max-size-buffers=2 leaky=downstream !
        video/x-raw,framerate=30/1 !
        cudaupload ! cudaconvert ! queue !
        video/x-raw(memory:CUDAMemory),format=NV12 !
        nvautogpuh264enc name=encoder preset=2 gop-size=30 bitrate=6144
        vbv-buffer-size=6144 !
        h264parse config-interval=-1 !
        video/x-h264,stream-format=byte-stream ! queue ! mpegtsmux name=mux alignment=7 !
        udpsink host=mediamtx port=1234 sync=false buffer-size=524288
        pulsesrc device=audio_output.monitor ! queue ! audioconvert ! audioresample !
        audio/x-raw,channels=2 ! voaacenc bitrate=320000 ! aacparse ! queue ! mux.
    depends_on:
      - mediamtx
    devices:
      - nvidia.com/gpu=all

  mediamtx:
    image: docker.io/bluenviron/mediamtx:latest-ffmpeg
    container_name: vrchat-mediamtx
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "8554:8554"
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_PATHS_LIVE_HLS_AUDIO_ENCODER: aac
      MTX_PATHS_LIVE_HLS_AUDIO_ENCODER_ARGS: audio_bitrate=320k,channels=2
      MTX_HLSMODE: muxer
      MTX_HLSVARIANT: mpegts
      MTX_HLSALWAYSREMUX: "yes"
      MTX_HLSSEGMENTDURATION: 1s
      MTX_HLSSEGMENTCOUNT: "4"
      MTX_PATHS_LIVE_SOURCE: "udp://mediamtx:1234?pkt_size=1316"
    expose:
      - "1234/udp"
